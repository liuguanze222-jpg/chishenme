<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>吃啥 · 通用转盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#f4f6f4;color:#1c2620;font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif}
.wrap{max-width:660px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:21px;font-weight:600;color:#14231a;letter-spacing:-.02em}
.sub{font-size:12.5px;color:#6b7670;margin-top:4px;line-height:1.5}
.src{font-size:11px;color:#8a948d;margin-top:6px}

.cates{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.cate{font-size:12.5px;color:#3f4c45;background:#fff;border:1px solid #e2e7e3;border-radius:15px;
      padding:6px 12px;cursor:pointer}
.cate.on{border-color:#17b04b;color:#0f7a35;background:#f3fbf6;font-weight:600}
.cate .n{font-size:10px;color:#98a29b;margin-left:4px}
.cate.on .n{color:#5aa877}

.stage{position:relative;margin-top:12px}
.wheelbox{position:relative;width:min(320px,80vw);aspect-ratio:1/1;margin:0 auto}
#rotor{position:absolute;inset:0;transition:transform 3.6s cubic-bezier(.12,.8,.08,1)}
.pointer{position:absolute;top:-9px;left:50%;margin-left:-11px;width:22px;height:27px;z-index:3}
#hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;
     background:#fff;border:1px solid #dfe5e0;color:#14231a;font-size:19px;font-weight:600;cursor:pointer;
     z-index:2;box-shadow:0 2px 8px rgba(20,40,28,.10)}
#hub:active{transform:translate(-50%,-50%) scale(.92)}
#hub:disabled{color:#98a29b}
.hint{text-align:center;font-size:11px;color:#8a948d;margin-top:8px;line-height:1.6}

.result{margin-top:10px;background:#fff;border:1px solid #e6eae6;border-radius:13px;padding:16px;
        box-shadow:0 2px 10px rgba(20,40,28,.05);text-align:center;
        animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.rlabel{font-size:11px;color:#17b04b;font-weight:600;letter-spacing:1px}
.rname{font-size:23px;font-weight:700;color:#14231a;margin-top:6px;line-height:1.3;word-break:break-all}
.rmeta{font-size:11.5px;color:#6b7670;margin-top:5px}
.ractions{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid #d5ddd6;background:#fff;color:#2a3a30;font-size:13px;padding:8px 16px;border-radius:9px;cursor:pointer}
.btn.primary{background:#17b04b;border-color:#17b04b;color:#fff;font-weight:600}

.sec{margin-top:20px;font-size:14.5px;font-weight:600;color:#14231a;display:flex;justify-content:space-between;align-items:baseline}
.sec .n{font-size:11px;color:#8a948d;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;max-height:300px;overflow-y:auto}
.chipx{font-size:12px;color:#3f4c45;background:#fff;border:1px solid #e2e7e3;border-radius:12px;padding:5px 10px}
.chipx.on{border-color:#9dd3b2;background:#f3fbf6;color:#0f7a35}

.hist{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{background:#fff;border:1px solid #e6eae6;border-radius:11px;font-size:11px;color:#5a6660;padding:4px 10px}
.chip b{color:#1c2620;font-weight:600}
details{margin-top:14px;background:#fff;border:1px solid #e6eae6;border-radius:12px;overflow:hidden}
summary{padding:10px 13px;font-size:13px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:'▾';color:#a6afa9;font-size:11px}
details[open] summary::after{content:'▴'}
.dbody{padding:0 12px 12px;display:flex;gap:8px}
.dbody input{flex:1;min-width:0;border:1px solid #d5ddd6;border-radius:9px;padding:9px 10px;font-size:13px}
.dbody .btn{white-space:nowrap}
.foot{margin-top:24px;text-align:center;font-size:10.5px;color:#a6afa9;line-height:1.9}
.foot a{color:#0f7a35;text-decoration:none;border-bottom:1px dashed #b9dcc6}
</style>
</head>
<body>
<div class="wrap">
  <h1>吃啥</h1>
  <div class="sub">全国通用的店和品类，选个分类，转到哪个吃哪个</div>
  <div class="src" id="src"></div>

  <div class="cates" id="cates"></div>

  <div class="stage">
    <div class="wheelbox">
      <div id="rotor"><svg id="svg" width="100%" height="100%" viewBox="0 0 340 340"></svg></div>
      <svg class="pointer" viewBox="0 0 22 27"><path d="M11 26 1 2h20L11 26Z" fill="#17b04b"/></svg>
      <button id="hub" type="button">转</button>
    </div>
    <div class="hint" id="hint"></div>

    <div class="result" id="result" style="display:none">
      <div class="rlabel">就吃这个</div>
      <div class="rname" id="rname"></div>
      <div class="rmeta" id="rmeta"></div>
      <div class="ractions">
        <button class="btn primary" id="again">再转一次</button>
        <button class="btn" id="notwant">不想吃这个</button>
      </div>
    </div>
  </div>

  <div class="sec">本类选项 <span class="n" id="cnt"></span></div>
  <div class="chips" id="chips"></div>

  <div class="sec">最近转到 <span class="n" id="clr" style="cursor:pointer;color:#0f7a35">清空</span></div>
  <div class="hist" id="hist"></div>

  <details>
    <summary>自己加一个</summary>
    <div class="dbody">
      <input id="manual" type="text" maxlength="30" placeholder="比如：楼下那家黄焖鸡">
      <button class="btn" id="addBtn">加入</button>
    </div>
  </details>

  <div class="foot">
    通用版 · 无需联网 · 数据存本地<br>
    <a href="./">学校专用版（真实菜单）</a> · <a href="./manual.html">空白转盘</a>
  </div>
</div>

<script>
/* ============ 通用库：全国都能找到的连锁 + 常见品类 ============ */

   '永和大王','吉野家','食其家','南城香','和府捞面','老娘舅蒸菜','真功夫排骨饭','煲仔饭','卤肉饭',
   '猪脚饭','鸡腿饭','盖浇饭','自选快餐'

   '阳春面','打卤面','biangbiang面','安徽板面','牛肉拉面','酸汤面','凉面','炒面','拌面'

 {key:'rice', name:'米粉米线', items:[
   '螺蛳粉','桂林米粉','云南过桥米线','湖南米粉','广式肠粉','酸辣粉','花甲粉','鸭血粉丝汤',
   '新疆炒米粉','米线','河粉','炒河粉','牛杂粉','猪脚粉','砂锅米线','拌粉','蒸米粉','鱼粉'
 ]},

   '麻辣香锅','关东煮','冒烤鸭','火锅菜','麻辣烫自选','宽粉','麻酱小料','酸辣粉'

   '烤生蚝','炸串','烤肉拌饭','烤鸡翅','烤韭菜','烤茄子','烤玉米','大腰子','烤饼'

   '部队锅','石锅拌饭','韩式炸鸡','韩式烤肉','泡菜汤','辣炒年糕','紫菜包饭','冷面',
   '芝士排骨','韩式炸酱面','大酱汤','鱼饼汤','参鸡汤','炸鸡啤酒'

 {key:'sweet', name:'甜品烘焙', items:[
   '好利来','鲍师傅','泸溪河','面包新语','85度C','提拉米苏','蛋挞','可颂','蛋糕','布丁',
   '冰淇淋','双皮奶','杨枝甘露','雪媚娘','泡芙','肉松小贝','麻薯','千层'
 ]},
 {key:'home', name:'家常菜', items:[
   '番茄炒蛋','鱼香肉丝','宫保鸡丁','红烧肉','回锅肉','麻婆豆腐','酸菜鱼','水煮肉片',
   '小炒肉','地三鲜','干锅花菜','清炒时蔬','糖醋里脊','可乐鸡翅','土豆丝','蒜蓉粉丝',
   '排骨汤','紫菜蛋汤'
 ]},
 {key:'night', name:'便利店夜宵', items:[
   '便利店关东煮','饭团','泡面','烧烤摊','炒饭','炒粉','煎饼','肉夹馍','手抓饼','鸡蛋灌饼',
   '卤味','鸭脖','炸鸡架','夜宵摊','烤肠','茶叶蛋','八宝粥','自热火锅'
 ]}
];

var SHADES=['#e6f2ea','#ffffff','#dcefe3','#f4f9f5','#e9f4ec','#fbfdfc','#d5e9dd','#eef7f1','#e1f0e7','#ffffff'];
var cate=LIB[0].key, custom=[], histArr=[], rotation=0, spinning=false, lastPick=null;

function esc(s){return String(s==null?'':s).replace(/[<>&"']/g,function(c){
  return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c];});}
function darken(hex,amt){if(!hex||hex[0]!=='#')return hex;var v=parseInt(hex.slice(1),16);
  var r=Math.max(0,((v>>16)&255)-amt),g=Math.max(0,((v>>8)&255)-amt),b=Math.max(0,(v&255)-amt);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function trunc(s,n){s=String(s||'').trim();return s.length>n?s.slice(0,n)+'…':s;}

function curList(){
  var c=LIB.filter(function(x){return x.key===cate;})[0];
  if(!c) return LIB[0].items.slice();
  return c.items.concat(custom);
}
function save(){
  try{
    localStorage.setItem('lib-cate',cate);
    localStorage.setItem('lib-custom',JSON.stringify(custom));
    localStorage.setItem('lib-hist',JSON.stringify(histArr.slice(0,12)));
  }catch(e){}
}
function load(){
  try{
    var c=localStorage.getItem('lib-cate'); if(c) cate=c;
    var cu=JSON.parse(localStorage.getItem('lib-custom')||'[]'); if(cu.length) custom=cu;
    var h=JSON.parse(localStorage.getItem('lib-hist')||'[]'); if(h.length) histArr=h;
  }catch(e){}
}

/* ---------- 画盘 ---------- */
var CX=170,CY=170,R=140;
function polar(r,deg){var rad=(deg-90)*Math.PI/180;return [CX+r*Math.cos(rad),CY+r*Math.sin(rad)];}
function draw(list){
  var n=list.length,parts=[];
  parts.push('<circle cx="170" cy="170" r="140" fill="#ffffff" stroke="#e2e7e3"/>');
  if(!n){document.getElementById('svg').innerHTML=parts.join('');return;}
  var seg=360/n, showText=n<=26;
  for(var i=0;i<n;i++){
    var a0=i*seg,a1=a0+seg,p0=polar(R,a0),p1=polar(R,a1),large=(a1-a0)>180?1:0;
    var base=SHADES[i%SHADES.length],fill=(i%2)?darken(base,7):base;
    parts.push('<path d="M170 170 L'+p0[0].toFixed(2)+' '+p0[1].toFixed(2)+' A140 140 0 '+large+
      ' 1 '+p1[0].toFixed(2)+' '+p1[1].toFixed(2)+' Z" fill="'+fill+'" stroke="#e3ebe6" stroke-width="0.8"/>');
    if(showText){
      var mid=a0+seg/2,tp=polar(R*0.66,mid),rot=mid+90;
      if(rot>90&&rot<270)rot-=180;
      var fs=n>20?7:(n>12?9:12),keep=n>20?3:(n>12?5:7);
      parts.push('<text x="'+tp[0].toFixed(1)+'" y="'+tp[1].toFixed(1)+'" text-anchor="middle" '+
        'dominant-baseline="middle" fill="#1a2e22" font-size="'+fs+'" font-family="PingFang SC,sans-serif" '+
        'transform="rotate('+rot.toFixed(1)+' '+tp[0].toFixed(1)+' '+tp[1].toFixed(1)+')">'+
        esc(trunc(list[i],keep))+'</text>');
    }
  }
  parts.push('<circle cx="170" cy="170" r="56" fill="#ffffff" stroke="#eef1ee"/>');
  document.getElementById('svg').innerHTML=parts.join('');
}

/* ---------- 转 ---------- */
function spin(){
  var list=curList();
  if(spinning||list.length<2) return;
  spinning=true;
  var hub=document.getElementById('hub');hub.disabled=true;hub.textContent='…';
  document.getElementById('result').style.display='none';
  draw(list);
  var n=list.length,seg=360/n;
  var idx=Math.floor(Math.random()*n);
  var jitter=(Math.random()-0.5)*seg*0.62;
  var target=(360-((idx+0.5)*seg+jitter)%360+360)%360;
  var cur=((rotation%360)+360)%360;
  rotation+=360*3+((target-cur+360)%360);
  document.getElementById('rotor').style.transform='rotate('+rotation+'deg)';
  var done=false;
  function fin(){
    if(done)return;done=true;
    setTimeout(function(){
      spinning=false;hub.disabled=false;hub.textContent='转';
      lastPick=list[idx];
      document.getElementById('rname').textContent=lastPick;
      document.getElementById('rmeta').textContent=(LIB.filter(function(x){return x.key===cate;})[0]||{}).name||'';
      document.getElementById('result').style.display='block';
      histArr.unshift({name:lastPick,at:Date.now()});
      histArr=histArr.slice(0,12);save();renderHist();
    },90);
  }
  document.getElementById('rotor').addEventListener('transitionend',fin,{once:true});
  setTimeout(fin,4500);
}

/* ---------- UI ---------- */
function renderCates(){
  var box=document.getElementById('cates');
  box.innerHTML=LIB.map(function(c){
    return '<span class="cate '+(c.key===cate?'on':'')+'" data-k="'+c.key+'">'+c.name+
      '<span class="n">'+c.items.length+(c.key===cate&&custom.length?('+'+custom.length):'')+'</span></span>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.cate'),function(el){
    el.addEventListener('click',function(){
      cate=this.getAttribute('data-k');
      save();renderCates();renderChips();draw(curList());renderHint();
    });
  });
}
function renderChips(){
  var list=curList();
  document.getElementById('chips').innerHTML=list.map(function(t){
    return '<span class="chipx on">'+esc(t)+'</span>';
  }).join('');
  document.getElementById('cnt').textContent=list.length+' 个';
  document.getElementById('src').textContent='共 '+LIB.length+' 个分类 / '+
    LIB.reduce(function(a,c){return a+c.items.length;},0)+' 个选项 · 无需联网';
}
function renderHint(){
  var n=curList().length;
  document.getElementById('hint').textContent = n>26
    ? (n+' 个选项全在盘上（片多，结果看名字）')
    : (n+' 个选项，等概率');
}
function renderHist(){
  var box=document.getElementById('hist');
  if(!histArr.length){ box.innerHTML='<span class="chip">还没转过</span>'; return; }
  box.innerHTML=histArr.map(function(it){
    var d=new Date(it.at);
    var hm=(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
    return '<span class="chip"><b>'+esc(trunc(it.name,10))+'</b> '+hm+'</span>';
  }).join('');
}

document.getElementById('hub').addEventListener('click',spin);
document.getElementById('again').addEventListener('click',spin);
document.getElementById('notwant').addEventListener('click',function(){
  if(!lastPick) return;
  var i=custom.indexOf(lastPick);
  if(i>=0) custom.splice(i,1);
  lastPick=null;
  document.getElementById('result').style.display='none';
  save();renderChips();draw(curList());renderHint();
});
document.getElementById('clr').addEventListener('click',function(){ histArr=[];save();renderHist(); });
document.getElementById('addBtn').addEventListener('click',function(){
  var inp=document.getElementById('manual');
  var v=inp.value.trim();
  if(!v) return;
  if(curList().indexOf(v)>=0){ alert('已经有了'); return; }
  custom.push(v); inp.value='';
  save();renderCates();renderChips();draw(curList());renderHint();
});
document.getElementById('manual').addEventListener('keydown',function(e){
  if(e.key==='Enter') document.getElementById('addBtn').click();
});

load();renderCates();renderChips();renderHist();draw(curList());renderHint();
</script>
</body>
</html>
